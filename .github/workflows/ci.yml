name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath, intl, zip, curl, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      # phpunit.xml forces the test env, but Laravel still needs an app key.
      - name: Generate test app key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env

      # Wayfinder generates resources/js/routes and resources/js/actions during
      # the Vite build. They are gitignored, so tsc needs them generated first.
      - name: Build frontend (generates Wayfinder routes/actions)
        run: npm run build

      - name: Run formatting, types and tests
        run: composer ci:check
